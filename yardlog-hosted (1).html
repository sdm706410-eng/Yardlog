<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YARDLOG — Fleet &amp; Machine Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15181b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YARDLOG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --steel-900:#15181b; --steel-800:#1e2226; --steel-700:#282d32; --steel-600:#383e44; --steel-500:#5a626a;
  --concrete-400:#8b9096; --off-white:#eeece6; --amber:#f2a733; --amber-dim:#8a651f; --signal:#e14e2a; --good:#5fa96a;
  --hazard-a:#f2a733; --hazard-b:#1e2226; --radius-s:4px; --radius-m:8px; --radius-l:14px;
  --shadow-card:0 6px 20px -8px rgba(0,0,0,.55); --dur:.28s; --ease:cubic-bezier(.22,.9,.32,1);
}
[data-theme="light"]{
  --steel-900:#eef0f1; --steel-800:#ffffff; --steel-700:#f3f4f5; --steel-600:#e2e5e7; --steel-500:#aeb4b9;
  --concrete-400:#5c6469; --off-white:#181b1d; --amber:#c9821a; --amber-dim:#e8c68f; --shadow-card:0 6px 20px -10px rgba(20,20,20,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--steel-900); color:var(--off-white); font-family:'Inter',system-ui,sans-serif; overflow-x:hidden;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease); -webkit-font-smoothing:antialiased;}
body[data-lang="mr"]{font-family:'Noto Sans Devanagari','Inter',system-ui,sans-serif;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
.mono{font-family:'JetBrains Mono',monospace;}
h1,h2,h3,.display{font-family:'Barlow Condensed',sans-serif; letter-spacing:.01em;}
body[data-lang="mr"] h1, body[data-lang="mr"] h2, body[data-lang="mr"] h3{font-family:'Noto Sans Devanagari',sans-serif;}
::selection{background:var(--amber); color:#181b1d;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}

#app{max-width:560px; margin:0 auto; min-height:100vh; position:relative; background:var(--steel-900); box-shadow:0 0 60px rgba(0,0,0,.35);}
@media (min-width:900px){ #app{max-width:640px;} }

.topbar{position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
  background:var(--steel-900); border-bottom:1px solid var(--steel-700); backdrop-filter:blur(6px);}
.icon-btn{width:40px;height:40px; border-radius:var(--radius-m); border:1px solid var(--steel-700); background:var(--steel-800);
  color:var(--off-white); display:flex; align-items:center; justify-content:center;
  transition:transform var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur);}
.icon-btn:active{transform:scale(.9);}
.icon-btn:hover{border-color:var(--amber);}
.brand{display:flex; flex-direction:column; align-items:center; line-height:1; user-select:none;}
.brand .name{font-size:22px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;}
.brand .name span{color:var(--amber);}
.brand .tag{font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--concrete-400); margin-top:2px;}

.scrim{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; opacity:0; pointer-events:none; transition:opacity var(--dur) var(--ease);}
.scrim.open{opacity:1; pointer-events:auto;}
.drawer{position:fixed; top:0; left:0; height:100%; width:82%; max-width:340px; z-index:60; background:var(--steel-800);
  border-right:1px solid var(--steel-700); transform:translateX(-105%); transition:transform var(--dur) var(--ease);
  display:flex; flex-direction:column; padding:20px 0 14px;}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:0 20px 16px; border-bottom:1px solid var(--steel-700); margin-bottom:8px;}
.drawer-avatar{width:52px;height:52px;border-radius:50%; background:linear-gradient(145deg,var(--amber),var(--amber-dim));
  display:flex;align-items:center;justify-content:center; font-weight:700; font-size:20px; color:#181b1d; font-family:'Barlow Condensed'; margin-bottom:10px;}
.drawer-head .who-name{font-weight:700; font-size:17px;}
.drawer-head .who-role{color:var(--concrete-400); font-size:12px; margin-top:2px;}
.drawer nav{display:flex; flex-direction:column; padding:6px 10px; gap:2px;}
.drawer-item{display:flex; align-items:center; gap:12px; padding:12px 12px; border-radius:var(--radius-m); background:transparent;
  border:none; color:var(--off-white); font-size:15px; text-align:left; width:100%; transition:background var(--dur);}
.drawer-item:hover{background:var(--steel-700);}
.drawer-item.active{background:var(--steel-700); color:var(--amber);}
.drawer-item .ic{width:20px; text-align:center; opacity:.85;}
.drawer-foot{margin-top:auto; padding:14px 20px 4px; border-top:1px solid var(--steel-700);}
.drawer-foot .small{font-size:11px; color:var(--concrete-400); letter-spacing:.05em;}

.view{padding:16px 16px 100px; animation:viewIn var(--dur) var(--ease);}
@keyframes viewIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.view-title{display:flex; align-items:center; gap:10px; margin:4px 0 18px;}
.view-title h1{font-size:28px; margin:0; font-weight:700;}
.back-btn{width:34px;height:34px;border-radius:50%; border:1px solid var(--steel-700); background:var(--steel-800);
  display:flex;align-items:center;justify-content:center; color:var(--off-white); transition:transform var(--dur);}
.back-btn:active{transform:scale(.88);}

.stat-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:20px;}
.stat-card{background:var(--steel-800); border:1px solid var(--steel-700); border-radius:var(--radius-m); padding:10px 8px; text-align:center;}
.stat-card .v{font-family:'JetBrains Mono'; font-weight:700; font-size:15px; color:var(--amber);}
.stat-card .l{font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--concrete-400); margin-top:4px;}

.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.section-head h2{font-size:20px; margin:0; font-weight:700;}
.add-btn{display:flex; align-items:center; gap:6px; background:var(--amber); color:#181b1d; border:none; padding:9px 14px;
  border-radius:999px; font-weight:700; font-size:13px; letter-spacing:.02em; transition:transform var(--dur), box-shadow var(--dur);}
.add-btn:hover{box-shadow:0 4px 14px -4px var(--amber);}
.add-btn:active{transform:scale(.95);}

.machine-grid{display:flex; flex-direction:column; gap:12px;}
.machine-card{position:relative; background:var(--steel-800); border:1px solid var(--steel-700); border-radius:var(--radius-l);
  padding:16px 16px 16px 18px; overflow:hidden; display:flex; align-items:center; gap:14px; cursor:pointer;
  transition:transform var(--dur) var(--ease), border-color var(--dur), box-shadow var(--dur);}
.machine-card::before{content:""; position:absolute; top:0; right:0; width:40px; height:40px;
  background:repeating-linear-gradient(45deg, var(--hazard-a) 0 6px, var(--hazard-b) 6px 12px); clip-path:polygon(100% 0, 0 0, 100% 100%); opacity:.75;}
.machine-card:hover{transform:translateY(-2px); border-color:var(--amber-dim); box-shadow:var(--shadow-card);}
.machine-card:active{transform:scale(.985);}
.mc-type-ic{width:44px;height:44px; border-radius:var(--radius-m); background:var(--steel-700); display:flex; align-items:center;
  justify-content:center; color:var(--amber); flex:0 0 auto;}
.mc-body{flex:1; min-width:0;}
.mc-vno{font-family:'JetBrains Mono'; font-weight:700; font-size:17px; letter-spacing:.02em;}
.mc-loc{color:var(--concrete-400); font-size:12.5px; margin-top:5px; display:flex; align-items:center; gap:5px;}
.mc-turnover{font-size:12px; margin-top:7px; color:var(--good); font-weight:600;}
.mc-turnover b{font-family:'JetBrains Mono';}
.chev{color:var(--concrete-400); flex:0 0 auto;}

.empty-state{text-align:center; padding:50px 20px; color:var(--concrete-400); border:1px dashed var(--steel-600); border-radius:var(--radius-l); font-size:14px;}
.empty-state .big-ic{font-size:34px; margin-bottom:10px; opacity:.6;}

.search-wrap{margin-bottom:16px;}
.search-bar{display:flex; align-items:center; gap:8px; background:var(--steel-800); border:1px solid var(--steel-700);
  border-radius:var(--radius-m); padding:10px 12px; transition:border-color var(--dur);}
.search-bar:focus-within{border-color:var(--amber);}
.search-bar input{flex:1; background:transparent; border:none; outline:none; color:var(--off-white); font-size:14px;}
.search-bar input::placeholder{color:var(--concrete-400);}
.filter-toggle{background:var(--steel-700); border:1px solid var(--steel-600); color:var(--off-white); border-radius:var(--radius-s);
  padding:6px 10px; font-size:12px; display:flex; gap:6px; align-items:center; transition:background var(--dur);}
.filter-toggle.on{background:var(--amber); color:#181b1d; border-color:var(--amber);}
.filters-panel{max-height:0; overflow:hidden; transition:max-height var(--dur) var(--ease), margin var(--dur);
  display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:0;}
.filters-panel.open{max-height:260px; margin-top:10px;}
.filters-panel .f-field{display:flex; flex-direction:column; gap:4px;}
.filters-panel label{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--concrete-400);}
.filters-panel input, .filters-panel select{background:var(--steel-800); border:1px solid var(--steel-700); border-radius:var(--radius-s);
  color:var(--off-white); padding:8px 9px; font-size:13px; outline:none;}
.filters-panel input:focus, .filters-panel select:focus{border-color:var(--amber);}
.filters-actions{grid-column:1 / -1; display:flex; gap:8px; margin-top:2px;}
.btn-ghost{flex:1; background:transparent; border:1px solid var(--steel-600); color:var(--off-white); border-radius:var(--radius-s); padding:9px; font-size:12.5px; font-weight:600;}
.btn-solid{flex:1; background:var(--amber); border:none; color:#181b1d; border-radius:var(--radius-s); padding:9px; font-size:12.5px; font-weight:700;}
.btn-danger{flex:1; background:var(--signal); border:none; color:#fff; border-radius:var(--radius-s); padding:9px; font-size:12.5px; font-weight:700;}

.detail-hero{background:linear-gradient(155deg, var(--steel-800), var(--steel-700)); border:1px solid var(--steel-700);
  border-radius:var(--radius-l); padding:18px; margin-bottom:18px; position:relative; overflow:hidden;}
.detail-hero::after{content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--amber);}
.detail-hero .vno{font-family:'JetBrains Mono'; font-size:26px; font-weight:700;}
.detail-hero .loc{color:var(--concrete-400); font-size:13px; margin-top:4px; display:flex; align-items:center; flex-wrap:wrap; gap:6px;}
.status-pill{font-size:9px; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:999px; font-weight:700;}
.status-pill.active{background:rgba(95,169,106,.18); color:var(--good);}
.status-pill.completed{background:rgba(242,167,51,.15); color:var(--amber);}
.type-pill{font-size:9px; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:999px; font-weight:700; background:var(--steel-600); color:var(--off-white);}
.hero-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
.hero-stat{background:rgba(0,0,0,.15); border-radius:var(--radius-s); padding:10px;}
[data-theme="light"] .hero-stat{background:rgba(0,0,0,.04);}
.hero-stat .l{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--concrete-400);}
.hero-stat .v{font-family:'JetBrains Mono'; font-weight:700; font-size:16px; margin-top:3px;}
.hero-actions{display:flex; gap:8px; margin-top:16px;}
.gauge-row{display:flex; align-items:center; gap:14px; margin-top:16px;}
.gauge{position:relative; width:56px; height:56px; flex:0 0 auto;}
.gauge svg{transform:rotate(-90deg);}
.gauge .bg{fill:none; stroke:var(--steel-600); stroke-width:5;}
.gauge .fg{fill:none; stroke:var(--amber); stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset .6s var(--ease);}
.gauge .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono'; font-size:11px; font-weight:700;}

.no-job-card{border:1px dashed var(--steel-600); border-radius:var(--radius-l); padding:26px 18px; text-align:center; margin-bottom:18px;}
.no-job-card p{color:var(--concrete-400); font-size:13.5px; margin:0 0 14px;}

.log-list{display:flex; flex-direction:column; gap:10px;}
.log-item{display:flex; align-items:center; justify-content:space-between; background:var(--steel-800); border:1px solid var(--steel-700);
  border-radius:var(--radius-m); padding:12px 14px; animation:viewIn var(--dur) var(--ease);}
.log-item .amt{font-family:'JetBrains Mono'; font-weight:700; color:var(--good);}
.log-item .date{font-size:11px; color:var(--concrete-400); margin-top:2px;}
.log-item .note{font-size:12.5px; margin-top:2px;}

.job-hist-card{background:var(--steel-800); border:1px solid var(--steel-700); border-radius:var(--radius-m); padding:12px 14px; margin-bottom:10px; cursor:pointer; transition:border-color var(--dur);}
.job-hist-card:hover{border-color:var(--amber-dim);}
.job-hist-card .top{display:flex; justify-content:space-between; align-items:center;}
.job-hist-card .loc2{font-size:12.5px; color:var(--concrete-400); margin-top:4px;}
.job-hist-card .figs{display:flex; gap:14px; margin-top:6px; font-size:11px; color:var(--concrete-400);}
.job-hist-card .figs b{color:var(--off-white); font-family:'JetBrains Mono';}

.type-select-row{display:flex; gap:10px; margin-bottom:16px;}
.type-opt{flex:1; background:var(--steel-900); border:1.5px solid var(--steel-700); border-radius:var(--radius-m); padding:16px 12px;
  text-align:center; transition:border-color var(--dur), background var(--dur); display:flex; flex-direction:column; align-items:center; gap:8px;}
.type-opt.selected{border-color:var(--amber); background:rgba(242,167,51,.08);}
.type-opt .ti{color:var(--amber);}
.type-opt .tn{font-weight:700; font-size:13.5px;}
.type-opt .ts{font-size:10.5px; color:var(--concrete-400);}

.modal-scrim{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:70; opacity:0; pointer-events:none; transition:opacity var(--dur);}
.modal-scrim.open{opacity:1; pointer-events:auto;}
.sheet{position:fixed; left:50%; bottom:0; transform:translate(-50%,110%); width:100%; max-width:560px; z-index:80;
  background:var(--steel-800); border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  transition:transform var(--dur) var(--ease); max-height:86vh; overflow-y:auto; border-top:1px solid var(--steel-700);}
.sheet.open{transform:translate(-50%,0);}
.sheet-handle{width:38px;height:4px;background:var(--steel-600);border-radius:2px;margin:0 auto 14px;}
.sheet h3{margin:0 0 14px; font-size:20px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--concrete-400); margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; background:var(--steel-900); border:1px solid var(--steel-700); border-radius:var(--radius-s);
  color:var(--off-white); padding:11px 12px; font-size:14px; outline:none; transition:border-color var(--dur);}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--amber);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.sheet-actions{display:flex; gap:10px; margin-top:16px;}

.switch{position:relative; width:44px; height:25px; flex:0 0 auto;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; inset:0; background:var(--steel-600); border-radius:999px; transition:background var(--dur); cursor:pointer;}
.slider::before{content:""; position:absolute; width:19px; height:19px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform var(--dur) var(--ease);}
.switch input:checked + .slider{background:var(--amber);}
.switch input:checked + .slider::before{transform:translateX(19px);}

.row-card{background:var(--steel-800); border:1px solid var(--steel-700); border-radius:var(--radius-m); overflow:hidden; margin-bottom:14px;}
.row{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--steel-700); gap:10px;}
.row:last-child{border-bottom:none;}
.row .row-label{font-size:14.5px;}
.row .row-sub{font-size:11.5px; color:var(--concrete-400); margin-top:2px;}
.row-btn{background:transparent; border:none; color:var(--amber); font-size:13px; font-weight:600;}
.danger{color:var(--signal);}

.lang-toggle{display:flex; background:var(--steel-700); border-radius:999px; padding:3px; gap:2px;}
.lang-toggle button{flex:1; border:none; background:transparent; color:var(--concrete-400); padding:7px 10px; border-radius:999px; font-size:12.5px; font-weight:700; transition:background var(--dur), color var(--dur);}
.lang-toggle button.on{background:var(--amber); color:#181b1d;}

.admin-card{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--steel-700);}
.admin-card:last-child{border-bottom:none;}
.admin-ava{width:40px;height:40px;border-radius:50%; background:var(--steel-700); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Barlow Condensed'; color:var(--amber);}
.admin-info{flex:1;}
.admin-info .n{font-weight:600; font-size:14.5px;}
.admin-info .m{font-size:11.5px; color:var(--concrete-400);}

.signin-wrap{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:32px 24px; animation:viewIn var(--dur) var(--ease); position:relative;}
.signin-lang{position:absolute; top:20px; right:20px; width:120px;}
.signin-logo{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px;}
.signin-logo .mark{width:44px;height:44px;border-radius:12px;background:repeating-linear-gradient(45deg,var(--amber) 0 6px,var(--steel-900) 6px 12px); cursor:pointer;}
.signin-title{font-size:34px; font-weight:800; text-align:center; letter-spacing:.03em; text-transform:uppercase; user-select:none;}
.signin-title span{color:var(--amber);}
.signin-sub{text-align:center; color:var(--concrete-400); font-size:13px; margin-bottom:30px;}
.admin-pick{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
.admin-pick-btn{display:flex; align-items:center; gap:12px; background:var(--steel-800); border:1px solid var(--steel-700); border-radius:var(--radius-m);
  padding:12px 14px; text-align:left; transition:border-color var(--dur), transform var(--dur);}
.admin-pick-btn:hover{border-color:var(--amber-dim);}
.admin-pick-btn:active{transform:scale(.98);}
.divider-or{display:flex; align-items:center; gap:10px; color:var(--concrete-400); font-size:11px; margin:10px 0 18px; text-transform:uppercase; letter-spacing:.08em;}
.divider-or::before, .divider-or::after{content:""; flex:1; height:1px; background:var(--steel-700);}

.dev-badge{display:inline-flex; align-items:center; gap:6px; background:rgba(225,78,42,.14); color:var(--signal); border:1px solid rgba(225,78,42,.4); padding:6px 10px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; margin-bottom:14px;}
.dev-row-edit{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px 16px; border-bottom:1px solid var(--steel-700);}
.dev-row-edit input{background:var(--steel-900); border:1px solid var(--steel-700); border-radius:var(--radius-s); color:var(--off-white); padding:7px 9px; font-size:12.5px;}
.dev-mini-actions{display:flex; gap:6px; grid-column:1 / -1;}
.dev-mini-actions button{flex:1; font-size:11px; padding:6px;}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); z-index:100; background:var(--steel-800);
  border:1px solid var(--amber); color:var(--off-white); padding:12px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none;
  transition:all var(--dur) var(--ease); box-shadow:var(--shadow-card); display:flex; align-items:center; gap:8px; max-width:88%; text-align:center;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.warn{border-color:var(--signal);}

.loading-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:14px;}
.spinner{width:34px;height:34px;border-radius:50%; border:3px solid var(--steel-700); border-top-color:var(--amber); animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none !important;}

/* ===================== Storage layer (Firestore + localStorage) ===================== */
const FS_COLLECTION='yardlog';
const FS_DOC='shared-ledger';
const MAX_BYTES = 0.9*1024*1024; // Firestore documents cap at 1MB; stay under it with headroom

async function loadData(){
  if(!FIREBASE_READY) return { admins:[], vehicles:[], devPin:null };
  try{
    const snap=await getDoc(doc(fbDb, FS_COLLECTION, FS_DOC));
    if(snap.exists()) return snap.data();
  }catch(e){ console.error('Firestore load failed', e); }
  return { admins:[], vehicles:[], devPin:null };
}
function approxSize(data){ return new Blob([JSON.stringify(data)]).size; }
async function saveData(data){
  if(!FIREBASE_READY) return false;
  const size=approxSize(data);
  if(size > MAX_BYTES){ showToast(t('storageFull'),true); return false; }
  if(size > MAX_BYTES*0.85){ showToast(t('storageWarn'),true); }
  try{ await setDoc(doc(fbDb, FS_COLLECTION, FS_DOC), data); }
  catch(e){ console.error('Firestore save failed', e); showToast(t('storageFull'),true); return false; }
  return true;
}
async function loadPrefs(){
  try{ const raw=localStorage.getItem('yardlog-prefs'); if(raw) return JSON.parse(raw); }catch(e){}
  return { dark:true, lang:'en' };
}
async function savePrefs(p){ try{ localStorage.setItem('yardlog-prefs', JSON.stringify(p)); }catch(e){} }
async function loadSession(){
  try{ const raw=localStorage.getItem('yardlog-session'); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
async function saveSession(s){
  try{ if(s) localStorage.setItem('yardlog-session', JSON.stringify(s)); else localStorage.removeItem('yardlog-session'); }catch(e){}
}


/* ===================== Data migration (old flat schema -> jobs[]) ===================== */
function migrate(data){
  data.admins = data.admins || [];
  data.vehicles = (data.vehicles||[]).map(v=>{
    if(v.jobs) return v; // already migrated
    const job = { id: uid('job'), type: v.type||'machine', location: v.location||'', startLoc:'', destLoc:'',
      startDate: v.startDate||todayISO(), endDate: v.endDate||'', totalCost:v.totalCost||0,
      status: v.status||'active', logs: v.logs||[] };
    return { id:v.id, vehicleNo:v.vehicleNo, type: v.type||'machine', createdAt:v.updatedAt||Date.now(), updatedAt:v.updatedAt||Date.now(), jobs:[job] };
  });
  if(data.devPin===undefined) data.devPin=null;
  return data;
}

function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
const DEV_DIGIT_MAP={'०':'0','१':'1','२':'2','३':'3','४':'4','५':'5','६':'6','७':'7','८':'8','९':'9'};
function normPin(s){ return (s||'').toString().trim().split('').map(ch=>DEV_DIGIT_MAP[ch]||ch).join(''); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}); }
function fmtMoney(n){ n=Number(n)||0; return '₹'+n.toLocaleString('en-IN'); }
function currentAdmin(){ return DATA.admins.find(a=>a.id===(SESSION&&SESSION.adminId)); }
function escapeHTML(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function jobPaid(j){ return (j.logs||[]).reduce((s,l)=>s+Number(l.amount||0),0); }
function jobBalance(j){ return Math.max(0, Number(j.totalCost||0)-jobPaid(j)); }
function jobPaidPct(j){ const tc=Number(j.totalCost||0); if(tc<=0) return 0; return Math.min(100, Math.round(jobPaid(j)/tc*100)); }
function jobLocLabel(veh,j){ return veh.type==='transport' ? `${j.startLoc||'—'} → ${j.destLoc||'—'}` : (j.location||'—'); }
function currentJob(veh){ return (veh.jobs||[]).find(j=>j.status==='active') || null; }
function lastJob(veh){ const js=veh.jobs||[]; return js.length? js[js.length-1] : null; }
function vehicleTurnover(veh){ return (veh.jobs||[]).reduce((s,j)=>s+jobPaid(j),0); }
function vehicleCurrentLocation(veh){ const j=currentJob(veh); return j ? jobLocLabel(veh,j) : null; }

function totalRevenue(){ return DATA.vehicles.reduce((s,v)=>s+vehicleTurnover(v),0); }
function totalMachines(){ return DATA.vehicles.length; }
function activeJobsCount(){ return DATA.vehicles.filter(v=>currentJob(v)).length; }
function completedJobsCount(){ return DATA.vehicles.reduce((s,v)=>s+(v.jobs||[]).filter(j=>j.status==='completed').length,0); }

/* ===================== Toast ===================== */
let toastTimer;
function showToast(msg, warn){
  const t2=document.getElementById('toast');
  t2.textContent=msg; t2.classList.toggle('warn', !!warn);
  t2.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t2.classList.remove('show'), 2600);
}

/* ===================== Init ===================== */
async function init(){
  render(loadingScreen());
  if(!FIREBASE_READY){ render(setupNeededScreen()); return; }
  PREFS=await loadPrefs();
  if(!PREFS.lang) PREFS.lang='en';
  document.body.setAttribute('data-theme', PREFS.dark===false?'light':'dark');
  document.body.setAttribute('data-lang', PREFS.lang);
  DATA=migrate(await loadData());
  SESSION=await loadSession();
  if(DATA.admins.length===0){
    DATA.admins=[
      {id:uid('adm'),name:'',mobile:'',pin:'',active:true,setup:false},
      {id:uid('adm'),name:'',mobile:'',pin:'',active:true,setup:false}
    ];
    await saveData(DATA);
  }
  if(!SESSION || !currentAdmin()) VIEW='signin';
  renderApp();
}
function setupNeededScreen(){
  const d=document.createElement('div');
  d.className='signin-wrap';
  d.innerHTML=`
    <div class="signin-logo"><div class="mark"></div></div>
    <div class="signin-title">YARD<span>LOG</span></div>
    <div class="signin-sub" style="max-width:380px;margin:0 auto 20px;line-height:1.6;">
      This copy isn't connected to a database yet.<br><br>
      Open this file's HTML source, find the <span class="mono" style="color:var(--amber);">firebaseConfig</span> block near the top
      of the <span class="mono" style="color:var(--amber);">&lt;script type="module"&gt;</span> tag, and paste in your free Firebase project's
      6 config values — then re-upload / reopen. Full steps are in the comment right above it.
    </div>`;
  return d;
}
function loadingScreen(){
  const d=document.createElement('div'); d.className='loading-wrap';
  d.innerHTML='<div class="spinner"></div><div style="color:var(--concrete-400);font-size:13px;letter-spacing:.05em;">LOADING YARDLOG…</div>';
  return d;
}
function render(node){ const app=document.getElementById('app'); app.innerHTML=''; app.appendChild(node); }

/* ===================== Root render ===================== */
function renderApp(){
  document.body.setAttribute('data-theme', PREFS.dark===false?'light':'dark');
  document.body.setAttribute('data-lang', PREFS.lang);
  if(VIEW==='dev' && DEV_MODE){ render(DevPanelView()); return; }
  if(VIEW==='signin' || !SESSION || !currentAdmin()){ render(SignInView()); return; }
  const wrap=document.createElement('div');
  wrap.appendChild(TopBar());
  wrap.appendChild(Drawer());
  const scrim=document.createElement('div');
  scrim.className='scrim'+(DRAWER_OPEN?' open':'');
  scrim.onclick=()=>{ DRAWER_OPEN=false; renderApp(); };
  wrap.appendChild(scrim);
  const viewHost=document.createElement('div');
  if(VIEW==='home') viewHost.appendChild(HomeView());
  else if(VIEW==='detail') viewHost.appendChild(DetailView(ACTIVE_VEHICLE));
  else if(VIEW==='search') viewHost.appendChild(SearchView());
  else if(VIEW==='profile') viewHost.appendChild(ProfileView());
  else if(VIEW==='admins') viewHost.appendChild(AdminsView());
  else if(VIEW==='settings') viewHost.appendChild(SettingsView());
  wrap.appendChild(viewHost);
  render(wrap);
}

/* ===================== Top bar ===================== */
function TopBar(){
  const bar=document.createElement('div'); bar.className='topbar';
  bar.innerHTML=`<button class="icon-btn" id="menuBtn">${ICO.menu}</button>

  bar.querySelector('#brandLogo').onclick=handleLogoTap;

}

/* ===================== Hidden developer entry (tap logo 5x) ===================== */
function handleLogoTap(){
  const now=Date.now();
  logoTapTimes=logoTapTimes.filter(ts=>now-ts<2500);
  logoTapTimes.push(now);
  if(logoTapTimes.length>=5){ logoTapTimes=[]; openDevGate(); }
}
function openDevGate(){
  const body=document.createElement('div');
  const hasPin=!!DATA.devPin;
  body.innerHTML=`<div class="dev-badge">${ICO.settings} ${t('devAccessTitle')}</div>
    <div class="field"><label>${hasPin?t('devPinEnter'):t('devPinSet')}</label>
    <input type="password" inputmode="numeric" maxlength="8" id="devPinInput" placeholder="••••"></div>`;
  openSheet(t('devAccessTitle'), body, [
    {label:t('cancel'), ghost:true, action:closeSheet},
    {label: hasPin? t('signIn') : t('setDevPin'), action: async ()=>{
      const val=normPin(body.querySelector('#devPinInput').value);
      if(!hasPin){
        if(val.length<4){ showToast('PIN should be at least 4 digits'); return; }
        DATA.devPin=normPin(val); await saveData(DATA); DEV_MODE=true; VIEW='dev'; closeSheet(); renderApp();
      }else{
        if(val===normPin(DATA.devPin)){ DEV_MODE=true; VIEW='dev'; closeSheet(); renderApp(); }
        else{ showToast(t('devWrongPin')); }
      }
    }}
  ]);
}

/* ===================== Gauge ===================== */
function gaugeSVG(pct){
  const r=22,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<div class="gauge"><svg width="56" height="56" viewBox="0 0 56 56">
    <circle class="bg" cx="28" cy="28" r="${r}"/><circle class="fg" cx="28" cy="28" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg><div class="pct">${pct}%</div></div>`;
}

function openJobHistorySheet(veh, job){
  const body=document.createElement('div');
  const logs=(job.logs||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  body.innerHTML=`<div style="font-size:12.5px;color:var(--concrete-400);margin-bottom:10px;">${escapeHTML(jobLocLabel(veh,job))} · ${fmtDate(job.startDate)} – ${fmtDate(job.endDate)}</div>`;
  const list=document.createElement('div'); list.className='log-list';
  if(logs.length===0){ list.innerHTML=`<div class="empty-state">${t('noEntries')}</div>`; }
  logs.forEach(l=>{
    const it=document.createElement('div'); it.className='log-item';
    it.innerHTML=`<div><div class="note">${escapeHTML(l.note||t('addPayment'))}</div><div class="date">${fmtDate(l.date)}</div></div><div class="amt">+${fmtMoney(l.amount)}</div>`;
    list.appendChild(it);
  });
  body.appendChild(list);
  openSheet(t('jobHistory'), body, [{label:t('back'), ghost:true, action:closeSheet}]);
}

function applyLogFilters(logs, f){
  return logs.filter(l=>{
    if(f.q && !((l.note||'').toLowerCase().includes(f.q.toLowerCase()))) return false;
    if(f.minAmt!=='' && Number(l.amount) < Number(f.minAmt)) return false;
    if(f.maxAmt!=='' && Number(l.amount) > Number(f.maxAmt)) return false;
    if(f.month!=='' && new Date(l.date+'T00:00:00').getMonth()+1 !== Number(f.month)) return false;
    if(f.year!=='' && new Date(l.date+'T00:00:00').getFullYear() !== Number(f.year)) return false;
    if(f.days!==''){ const diff=(Date.now()-new Date(l.date+'T00:00:00').getTime())/86400000; if(diff>Number(f.days)) return false; }
    return true;
  });
}

async function toggleJobStatus(vehId, jobId, status){
  const veh=DATA.vehicles.find(v=>v.id===vehId);
  const job=(veh.jobs||[]).find(j=>j.id===jobId);
  job.status=status; veh.updatedAt=Date.now();
  if(status==='completed' && !job.endDate) job.endDate=todayISO();
  const ok=await saveData(DATA);
  if(ok){ showToast(status==='completed'?t('jobCompleted'):t('jobReopened')); renderApp(); }
}

    const hasAmtOrDate=state.minAmt||state.maxAmt||state.month||state.year||state.days;

      const allLocs=(veh.jobs||[]).map(j=>jobLocLabel(veh,j).toLowerCase()).join(' ');

    matches.forEach(veh=>host.appendChild(MachineCard(veh)));
  }
  renderResults();

function csvCell(v){
  const s=(v===undefined||v===null)?'':String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function doExportCSV(){
  const headers=['Vehicle No','Type','Location / Route','Job Status','Job Start Date','Job End Date',
    'Job Total Cost (₹)','Job Paid So Far (₹)','Job Balance Due (₹)','Entry Date','Entry Amount (₹)','Entry Note'];
  const rows=[headers];
  DATA.vehicles.forEach(veh=>{
    const typeLabel = veh.type==='transport' ? 'Transportation' : 'Digging Machine';
    (veh.jobs||[]).forEach(job=>{
      const loc = jobLocLabel(veh, job);
      const statusLabel = job.status==='completed' ? 'Completed' : 'Active';
      const logs=(job.logs||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
      if(logs.length===0){
        rows.push([veh.vehicleNo, typeLabel, loc, statusLabel, job.startDate||'', job.endDate||'',
          job.totalCost||0, jobPaid(job), jobBalance(job), '', '', '']);
      }else{
        logs.forEach(l=>{
          rows.push([veh.vehicleNo, typeLabel, loc, statusLabel, job.startDate||'', job.endDate||'',
            job.totalCost||0, jobPaid(job), jobBalance(job), l.date||'', l.amount||0, l.note||'']);
        });
      }
    });
  });
  const csv=rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`yardlog-records-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showToast(t('backedUp'));
}

function doBackup(){
  const blob=new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const url=URL.createObjectURL(blob);

  a.href=url; a.download=`yardlog-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);

}

    const parsed=JSON.parse(text);
    if(!parsed || !Array.isArray(parsed.vehicles) || !Array.isArray(parsed.admins)) throw new Error('bad shape');
    DATA=migrate(parsed);
    const ok=await saveData(DATA);

});

        logs: paid>0 ? [{id:uid('log'), date:todayISO(), amount:paid, note:'Initial amount recorded'}] : [] };
      veh.jobs.push(job); veh.updatedAt=Date.now();
      const ok=await saveData(DATA);
      if(ok){ closeSheet(); renderApp(); showToast(t('newJobStarted')); }
    }}
  ]);
}

function openLogSheet(vehId, jobId){
  const veh=DATA.vehicles.find(v=>v.id===vehId);
  const job=(veh.jobs||[]).find(j=>j.id===jobId);
  const body=document.createElement('div');
  body.innerHTML=`<div class="field"><label>${t('amount')}</label><input type="number" id="lAmt" placeholder="0"></div>
    <div class="field"><label>${t('date')}</label><input type="date" id="lDate" value="${todayISO()}"></div>
    <div class="field"><label>${t('note')}</label><input type="text" id="lNote"></div>`;
  openSheet(t('addPayment'), body, [
    {label:t('cancel'), ghost:true, action:closeSheet},
    {label:t('addEntry'), action: async()=>{
      const amt=Number(body.querySelector('#lAmt').value||0);
      if(amt<=0){ showToast(t('needAmt')); return; }
      const date=body.querySelector('#lDate').value||todayISO();
      const note=body.querySelector('#lNote').value.trim();
      job.logs=job.logs||[]; job.logs.push({id:uid('log'), date, amount:amt, note});
      veh.updatedAt=Date.now();
      const ok=await saveData(DATA);
      if(ok){ closeSheet(); renderApp(); showToast(t('entryAdded')); }
    }}
  ]);
}

/* ===================== Developer panel (hidden) ===================== */
function DevPanelView(){
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="view" style="padding-top:16px;">
    <div class="view-title"><button class="back-btn" id="devBack">${ICO.back}</button><h1 style="font-size:22px;">${t('devPanel')}</h1></div>
    <div class="dev-badge">${ICO.settings} ${t('devWarning')}</div>
    <div class="stat-strip">
      <div class="stat-card"><div class="v">${fmtMoney(totalRevenue())}</div><div class="l">${t('revenue')}</div></div>
      <div class="stat-card"><div class="v">${totalMachines()}</div><div class="l">${t('vehiclesLbl')}</div></div>
      <div class="stat-card"><div class="v">${activeJobsCount()}</div><div class="l">${t('active')}</div></div>
      <div class="stat-card"><div class="v">${completedJobsCount()}</div><div class="l">${t('completed')}</div></div>
    </div>
    <div class="section-head"><h2 style="font-size:16px;">Admins</h2></div>
    <div class="row-card" id="devAdmins"></div>
    <div class="section-head"><h2 style="font-size:16px;">Vehicles &amp; Jobs</h2></div>
    <div class="row-card" id="devVehicles"></div>
    <div class="section-head"><h2 style="font-size:16px;color:var(--signal);">${t('devDangerZone')}</h2></div>
    <div class="row-card"><div class="row"><div class="row-label">${t('devWipeAll')}</div><button class="row-btn danger" id="wipeAllBtn">${ICO.trash}</button></div></div>
    <button class="add-btn" id="devExitBtn" style="width:100%; justify-content:center; margin-top:10px;">${t('devExit')}</button>
  </div>`;
  wrap.querySelector('#devBack').onclick=wrap.querySelector('#devExitBtn').onclick=()=>{ DEV_MODE=false; VIEW=(SESSION&&currentAdmin())?'home':'signin'; renderApp(); };

  const adminsHost=wrap.querySelector('#devAdmins');
  DATA.admins.forEach((a,idx)=>{
    const row=document.createElement('div'); row.className='dev-row-edit';
    row.innerHTML=`<input placeholder="Name" value="${escapeHTML(a.name)}" data-f="name">
      <input placeholder="Mobile" value="${escapeHTML(a.mobile)}" data-f="mobile">
      <input placeholder="PIN" value="${escapeHTML(a.pin)}" data-f="pin">
      <label class="switch" style="align-self:center;"><input type="checkbox" ${a.active?'checked':''} data-f="active"><span class="slider"></span></label>
      <div class="dev-mini-actions">
        <button class="btn-solid" data-act="save">${t('devSave')}</button>
        <button class="btn-ghost" data-act="freeseat">${t('devDeleteAdmin')}</button>
      </div>`;
    row.querySelector('[data-act="save"]').onclick=async()=>{
      a.name=row.querySelector('[data-f="name"]').value.trim();
      a.mobile=row.querySelector('[data-f="mobile"]').value.trim();
      a.pin=normPin(row.querySelector('[data-f="pin"]').value);
      a.active=row.querySelector('[data-f="active"]').checked;
      const ok=await saveData(DATA); if(ok) showToast(t('devSave'));
    };
    row.querySelector('[data-act="freeseat"]').onclick=async()=>{
      a.name=''; a.mobile=''; a.pin=''; a.setup=false; a.active=true;
      const ok=await saveData(DATA); if(ok){ renderApp(); }
    };
    adminsHost.appendChild(row);
  });

  const vehHost=wrap.querySelector('#devVehicles');
  if(DATA.vehicles.length===0){ vehHost.innerHTML=`<div class="row"><div class="row-sub">${t('devNoData')}</div></div>`; }
  DATA.vehicles.forEach(veh=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<div><div class="row-label">${escapeHTML(veh.vehicleNo)} <span class="type-pill">${veh.type}</span></div>
      <div class="row-sub">${(veh.jobs||[]).length} job(s) · turnover ${fmtMoney(vehicleTurnover(veh))}</div></div>
      <button class="row-btn danger" data-id="${veh.id}">${ICO.trash}</button>`;
    row.querySelector('button').onclick=async()=>{
      DATA.vehicles=DATA.vehicles.filter(v=>v.id!==veh.id);
      const ok=await saveData(DATA); if(ok) renderApp();
    };
    vehHost.appendChild(row);
  });

  wrap.querySelector('#wipeAllBtn').onclick=()=>{
    const body=document.createElement('div');
    body.innerHTML=`<p style="color:var(--concrete-400);font-size:13.5px;">This erases every vehicle, job, and admin profile permanently.</p>`;
    openSheet(t('devWipeAll'), body, [
      {label:t('cancel'), ghost:true, action:closeSheet},
      {label:t('delete'), danger:true, action: async()=>{
        DATA={admins:[
          {id:uid('adm'),name:'',mobile:'',pin:'',active:true,setup:false},
          {id:uid('adm'),name:'',mobile:'',pin:'',active:true,setup:false}
        ], vehicles:[], devPin:DATA.devPin};
        await saveData(DATA); SESSION=null; await saveSession(null);
        closeSheet(); DEV_MODE=false; VIEW='signin'; renderApp();
      }}
    ]);
  };
  return wrap;
}

/* ===================== Generic bottom sheet ===================== */
let sheetEl=null, sheetScrimEl=null;
function openSheet(title, bodyNode, actions){
  closeSheet(true);
  sheetScrimEl=document.createElement('div'); sheetScrimEl.className='modal-scrim';
  sheetEl=document.createElement('div'); sheetEl.className='sheet';
  sheetEl.innerHTML=`<div class="sheet-handle"></div><h3>${title}</h3>`;
  sheetEl.appendChild(bodyNode);
  const actWrap=document.createElement('div'); actWrap.className='sheet-actions';
  actions.forEach(a=>{
    const b=document.createElement('button');
    b.className=a.danger?'btn-danger':(a.ghost?'btn-ghost':'btn-solid');
    b.textContent=a.label; b.onclick=a.action; actWrap.appendChild(b);
  });
  sheetEl.appendChild(actWrap);
  document.body.appendChild(sheetScrimEl); document.body.appendChild(sheetEl);
  sheetScrimEl.onclick=()=>closeSheet();
  requestAnimationFrame(()=>{ sheetScrimEl.classList.add('open'); sheetEl.classList.add('open'); });
  return sheetEl;
}
function closeSheet(instant){
  if(!sheetEl) return;
  const el=sheetEl, sc=sheetScrimEl; sheetEl=null; sheetScrimEl=null;
  if(instant){ el.remove(); sc.remove(); return; }
  el.classList.remove('open'); sc.classList.remove('open');
  setTimeout(()=>{ el.remove(); sc.remove(); }, 280);
}

/* ===================== Boot ===================== */
init();
</script>
